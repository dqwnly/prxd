name: Refresh verified proxies

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
  push:
    paths:
      - config.yml
      - requirements.txt
      - scripts/**
      - tests/**
      - .github/workflows/proxies.yml

permissions:
  contents: write

concurrency:
  group: proxy-pipeline
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  refresh:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Scrape, validate, and stage results
        run: python scripts/proxy_pipeline.py
      - name: Commit changed results
        run: python scripts/publish_results.py
