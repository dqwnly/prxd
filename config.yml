# Runtime settings. GitHub requires the workflow cron/timeout to be literal YAML.
max_ms: 5000
elite_only: true
concurrency: 1000
max_judges: 8
judge_validate_timeout: 8
judge_concurrency: 150
judge_max_rps: 50
source_timeout: 30
source_concurrency: 12
max_source_bytes: 67108864
max_judge_bytes: 262144
progress_every: 10000
nofile: 65536
user_agent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
real_ip_urls:
  - https://api.ipify.org?format=json
  - https://checkip.amazonaws.com/
  - https://httpbingo.org/ip
service_check:
  enabled: true
  limit: 3000
  timeout: 10
  concurrency: 300
  max_bytes: 4194304
checker_net:
  enabled: true
  days: 3
  url: https://checker.net/v1/landing/archive
publish:
  # Empty means the repository default branch checked out by Actions.
  branch: ''
  # history: normal commit; snapshot: replace a SEPARATE branch with one data-only commit.
  mode: history
services:
  - name: google
    url: https://www.google.com/search?q=proxy+test&hl=en
    blocked_url_markers: ['/sorry/']
    captcha_markers: ['unusual traffic', 'recaptcha', '/sorry/index']
    ok_markers: ['proxy test']
  - name: cloudflare
    url: https://www.cloudflare.com/
    blocked_url_markers: []
    captcha_markers: ['just a moment', 'cf-chl-', 'verify you are human']
    ok_markers: ['cloudflare']
  - name: amazon
    url: https://www.amazon.com/
    blocked_url_markers: ['/errors/validateCaptcha']
    captcha_markers: ['robot check', 'enter the characters you see below']
    ok_markers: ['amazon']
  - name: reddit
    url: https://www.reddit.com/
    blocked_url_markers: []
    captcha_markers: ['verify you are human', 'recaptcha']
    ok_markers: ['reddit']
  - name: instagram
    url: https://www.instagram.com/
    blocked_url_markers: ['/challenge/']
    captcha_markers: ['verify you are human', 'recaptcha']
    ok_markers: ['instagram']
  - name: discord
    url: https://discord.com/
    blocked_url_markers: []
    captcha_markers: ['verify you are human', 'just a moment']
    ok_markers: ['discord']
